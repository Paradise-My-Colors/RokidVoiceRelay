name: Build Voice Relay APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master, 'codex/aiui-voice-relay-0.9' ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 36 platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Restore persistent debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: rokid-voice-relay-debug-signing-v1
          fail-on-cache-miss: true

      - name: Select restored Voice Relay signing key
        shell: bash
        run: |
          test -f "$HOME/.android/debug.keystore"
          echo "VOICE_RELAY_SIGNING_FILE=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey

      - name: Fetch pinned TDLib 1.8.65 Android libraries
        shell: bash
        run: |
          curl -L --fail --retry 3 \
            "https://github.com/up9cloud/android-libtdjson/releases/download/v1.8.65/jniLibs.tar.gz" \
            -o /tmp/jniLibs.tar.gz
          echo "eb777d3e7baedeb02871c691b2090daa1bc51baf9215a81bc55bf54edb76df2b  /tmp/jniLibs.tar.gz" | sha256sum -c -
          rm -rf app/src/main/jniLibs jniLibs
          tar -xzf /tmp/jniLibs.tar.gz
          mv jniLibs app/src/main/jniLibs

      - name: Build the single-page Voice Relay Link package
        run: |
          npm ci --prefix tools/link-build
          node tools/link-build/build.mjs

      - name: Check the actual Java HTTP server with the AIUI network client
        shell: bash
        run: |
          curl --fail --location --silent --show-error https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar -o /tmp/link-json.jar
          echo '3cf6cd6892e32e2b4c1c39e0f52f5248a2f5b37646fdfbb79a66b46b618414ed  /tmp/link-json.jar' | sha256sum -c -
          curl --fail --location --silent --show-error https://repo.maven.apache.org/maven2/org/bouncycastle/bcprov-jdk18on/1.81/bcprov-jdk18on-1.81.jar -o /tmp/link-bc.jar
          echo '249f396412b0c0ce67f25c8197da757b241b8be3ec4199386c00704a2457459b  /tmp/link-bc.jar' | sha256sum -c -
          mkdir -p /tmp/link-classes
          javac -cp /tmp/link-json.jar:/tmp/link-bc.jar -d /tmp/link-classes app/src/main/java/com/paradisemc/rokid/plugin/voicerelay/link/LinkServer.java tests/LinkHarness.java
          VOICE_LINK_JAVA_CP=/tmp/link-classes:/tmp/link-json.jar:/tmp/link-bc.jar node tests/link.test.mjs

      - name: Check bundled code in QuickJS without Web Crypto
        run: |
          python3 -m pip install quickjs==1.19.4
          python3 tests/link-quickjs.py

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Check AIUI source and behavior
        run: node --experimental-vm-modules tests/aiui.test.mjs

      - name: Verify separate AIUI package and stable signer
        shell: bash
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          SIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$SIGNER" verify --print-certs "$APK" > /tmp/new-signer.txt
          grep -Fx 'Signer #1 certificate SHA-256 digest: 8ad4309337a31e99ee25ee5d14d2b94bf4d0d0917ff1d0b9574c044a7584c61a' /tmp/new-signer.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" > /tmp/apk-info.txt
          grep "^package: name='com.paradisemc.rokid.aiui.voicerelay' " /tmp/apk-info.txt
          grep "^launchable-activity: name='com.paradisemc.rokid.plugin.voicerelay.aiui.AiuiSettingsActivity' " /tmp/apk-info.txt
          cat /tmp/new-signer.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RokidVoiceRelay-Link-v1.1.0-test
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
