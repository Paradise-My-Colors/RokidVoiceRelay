name: Build Find My Phone APK

on:
  push:
    branches: [ build/find-my-phone-apk ]
    paths:
      - 'find-my-phone/**'
      - '.github/workflows/build-find-my-phone.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: find-my-phone
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RokidFindMyPhone-v0.1.0-debug
          path: find-my-phone/app/build/outputs/apk/debug/app-debug.apk
